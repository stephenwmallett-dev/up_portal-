document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\u002Fspan>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <main style=\"flex:1;\">\n\n  <!-- ============ CLIENT MODE ============ -->\n  <sc-if value=\"{{ isClient }}\" hint-placeholder-val=\"{{ false }}\">\n\n    <!-- CLIENT HOME (single city) -->\n    <sc-if value=\"{{ isClientHome }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"max-width:1060px; margin:0 auto; padding:64px 28px 90px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:20px;\">\n          <span style=\"font-family:'Archivo', sans-serif; font-weight:700; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#AC1BB9;\">{{ cityWhen }}<\u002Fspan>\n          <span style=\"flex:1; max-width:150px; height:1px; background:#dcd6cd;\"><\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase; font-size:clamp(42px, 7.5vw, 78px); line-height:0.98; letter-spacing:-0.01em; margin:0 0 18px;\">{{ cityName }} <span style=\"font-style:italic; color:#AC1BB9;\">casting.<\u002Fspan><\u002Fh1>\n        <p style=\"max-width:540px; color:#6f6a73; font-size:18px; line-height:1.55; margin:0 0 40px;\">Welcome! You're in. Upload your name, headshot and résumé to submit your profile for {{ cityName }}. That's it.<\u002Fp>\n\n        <div style=\"display:flex; gap:12px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ submitProfile }}\" style=\"background:#AC1BB9; color:#fff; border:none; border-radius:9px; padding:15px 26px; font-family:'Archivo', sans-serif; font-size:14px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#931AA0;\">Submit your profile<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ viewSubmissions }}\" style=\"background:transparent; color:#AC1BB9; border:1px solid #e3b8e7; border-radius:9px; padding:15px 26px; font-family:'Archivo', sans-serif; font-size:14px; font-weight:700; letter-spacing e; border-radius:9px; padding:12px 14px; font-family:'Archivo', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#000;\">Edit submissions<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ c.launch }}\" style=\"flex:1 1 150px; background:#AC1BB9; color:#fff; border:none; border-radius:9px; padding:12px 14px; font-family:'Archivo', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#931AA0;\">Launch client portal ↗<\u002Fbutton>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:16px; background:#faf8f4; border:1px solid #eee7dd; border-radius:10px; padding:12px 13px;\">\n                  <div style=\"font-family:'Archivo', sans-serif; font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#9a948a; margin-bottom:7px;\">Shareable client link<\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:10px;\">\n                    <span style=\"flex:1; min-width:0; font-family:monospace; font-size:12px; color:#3a363f; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ c.link }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ c.copy }}\" style=\"flex-shrink:0; background:transparent; color:#AC1BB9; border:1px solid #e3b8e7; border-radius:7px; padding:6px 12px; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#f9e8fa;\">{{ c.copyLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <button sc-camel-on-click=\"{{ c.archive }}\" style=\"margin-top:16px; align-self:flex-start; background:transparent; color:#9a948a; border:none; padding:4px 0; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;\" style-hover=\"color:#931AA0;\">↓ Move to Archive<\u002Fbutton>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ c.isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:-0.005em; font-size:22px; line-height:1.05;\">Edit city <span style=\"font-style:italic; color:#AC1BB9;\">details<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:12.5px; color:#9a948a; margin-top:6px; line-height:1.5;\">Renaming keeps the same client link — sent-out links stay valid.<\u002Fspan>\n                <div style=\"height:1px; background:#efe9e0; margin:18px 0;\"><\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ c.saveEdit }}\" style=\"display:flex; flex-direction:column; gap:11px;\">\n                  <label style=\"display:flex; flex-direction:column; gap:6px; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3a363f;\">\n                    City name\n                    <input type=\"text\" value=\"{{ c.draftName }}\" sc-camel-on-change=\"{{ c.onEditName }}\" style=\"font-family:'Hanken Grotesk', sans-serif; font-weight:400; letter-spacing:0; text-transform:none; font-size:14px; padding:10px 12px; border:1px solid #d7d2cb; border-radius:9px; background:#fff; color:#18151a;\" style-focus=\"border-color:#AC1BB9; outline:none;\">\n                  <\u002Flabel>\n                  <label style=\"display:flex; flex-direction:column; gap:6px; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3a363f;\">\n                    Venue &amp; dates\n                    <input type=\"text\" value=\"{{ c.draftWhen }}\" sc-camel-on-change=\"{{ c.onEditWhen }}\" style=\"font-family:'Hanken Grotesk', sans-serif; font-weight:400; letter-spacing:0; tex \n              <\u002Fsc-if>\n\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"flex:1 1 340px; background:#faf8f4; border:1px dashed #d3cabb; border-radius:14px; padding:28px; display:flex; flex-direction:column;\">\n            <span style=\"font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:-0.005em; font-size:24px; line-height:1.05;\">New city <span style=\"font-style:italic; color:#AC1BB9;\">event<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:13.5px; color:#6f6a73; margin-top:6px; line-height:1.5;\">Add a city and it instantly gets its own client portal link and password.<\u002Fspan>\n            <div style=\"height:1px; background:#eae2d6; margin:18px 0;\"><\u002Fdiv>\n            <form sc-camel-on-submit=\"{{ onCreateCity }}\" style=\"display:flex; flex-direction:column; gap:11px;\">\n              <label style=\"display:flex; flex-direction:column; gap:6px; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3a363f;\">\n                City name\n                <input type=\"text\" value=\"{{ newCityName }}\" sc-camel-on-change=\"{{ onNewCityName }}\" placeholder=\"e.g. London\" style=\"font-family:'Hanken Grotesk', sans-serif; font-weight:400; letter-spacing:0; text-transform:none; font-size:14px; padding:10px 12px; border:1px solid #d7d2cb; border-radius:9px; background:#fff; color:#18151a;\" style-focus=\"border-color:#AC1BB9; outline:none;\">\n              <\u002Flabel>\n              <label style=\"display:flex; flex-direction:column; gap:6px; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3a363f;\">\n                Venue &amp; dates\n                <input type=\"text\" value=\"{{ newCityWhen }}\" sc-camel-on-change=\"{{ onNewCityWhen }}\" placeholder=\"e.g. London · 10–12 May 2026\" style=\"font-family:'Hanken Grotesk', sans-serif; font-weight:400; letter-spacing:0; text-transform:none; font-size:14px; padding:10px 12px; border:1px solid #d7d2cb; border-radius:9px; background:#fff; color:#18151a;\" style-focus=\"border-color:#AC1BB9; outline:none;\">\n              <\u002Flabel>\n              <label style=\"display:flex; flex-direction:column; gap:6px; font-family:'Archivo', sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3a363f;\">\n                Event password\n                <input type=\"text\" value=\"{{ newCityCode }}\" sc-camel-on-change=\"{{ onNewCityCode }}\" placeholder=\"Used to view submissions\" style=\"font-family:'Hanken Grotesk', sans-serif; font-weight:400; letter-spacing:0; text-transform:none; font-size:14px; padding:10px 12px; border:1px solid #d7d2cb; border-radius:9px; background:#fff; color:#18151a;\" style-focus=\"border-color:#AC1BB9; outline:none;\">\n              <\u002Flabel>\n              <sc-if value=\"{{ cityFormError }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:13px; color:#931AA0;\">{{ cityFormError }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <button type=\"submit\" style=\"margin-top:2px; background:#AC1BB9; color:#fff; border:none; border-radius:9px; padding:12px 14px; font-family:'Archivo', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#931AA0;\">Create city event<\u002Fbutton>\n            <\u002Fform>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasArchived }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:56px;\">\n            <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:22px;\">\n              <span style=\"font-family:'Archivo', sans-serif; font-weight:700; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#9a948a;\">Archived events<\u002Fspan>\n              <span style=\"flex:1; height:1px; background:#dcd6cd;\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:12px;\">\n              <sc-for list=\"{{ archivedList }}\" as=\"c\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:#f1ede6; border:1px solid #e2dccf; border-radius:12px; padding:16px 20px;\">\n                  <div style=\"min-width:0;\">\n                    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\">\n                      <span style=\"font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase; font-size:19px; color:#3a363f;\">{{ c.name }}<\u002Fspan>\n                      <span style=\"font-family:'Archivo', sans-serif; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#9a948a; background:#e4ddd0; padding:3px 9px; border-radius:999px;\">Archived<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"display:block; font-size:13px; color:#8a857c; margin-top:5px;\">{{ c.when }} · {{ c.total }} submissions on file<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; gap:8px; flex-shrink:0;\">\n                    <button sc-camel-on-click=\"{{ c.edit }}\" style=\"background:transparent; color:#3a363f; border:1px solid #d3cabb; border-radius:8px; padding:9px 14px; font-family:'Archivo', sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#e8e1d5;\">View submissions<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ c.restore }}\" style=\"background:transparent; color:#AC1BB9; border:1px solid #e3b8e7; border-radius:8px; padding:9px 14px; font-family:'Archivo', sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#f9e8fa;\">Restore<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- MANAGE SUBMISSIONS -->\n    <sc-if value=\"{{ staffManage }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"max-width:880px; margin:0 auto; padding:44px 28px 90px;\">\n        <button sc-camel-on-click=\"{{ goLauncher }}\" style=\"font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#6f6a73; background:transparent; border:none; padding:0; cursor:pointer; margin-bottom:24px;\" style-hover=\"color:#AC1BB9;\">← Back to cities<\u002Fbutton>\n\n        <h1 style=\"font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase; font-size:36px; line-height:1.0; letter-spacing:-0.01em; margin:0 0 6px;\">Manage <span style=\"font-style:italic; color:#AC1BB9;\">submissions<\u002Fspan><\u002Fh1>\n        <p style=\"color:#6f6a73; font-size:15px; margin:0 0 26px;\">{{ staffTotal }} profiles · {{ staffPendingTotal }} pending review<\u002Fp>\n\n        <div style=\"display:flex; gap:12px; flex-wrap:wrap; margin-bottom:26px;\">\n          <sc-raw-select value=\"{{ staffCityFilter }}\" sc-camel-on-change=\"{{ onCityFilter }}\" style=\"font-family:'Hanken Grotesk', sans-serif; font-size:14px; padding:9px 12px; border:1px solid #d7d2cb; border-radius:9px; background:#fff; color:#18151a; cursor:pointer;\">\n            <option value=\"all\">All cities<\u002Foption>\n            <sc-for list=\"{{ cityFilterOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n              <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ staffStatusFilter }}\" sc-camel-on-change=\"{{ onStatusFilter }}\" style=\"font-family:'Hanken Grotesk', sans-serif; font-size:14px; padding:9px 12px; border:1px solid #d7d2cb; border-radius:9px; background:#fff; color:#18151a; cursor:pointer;\">\n            <option value=\"all\">All statuses<\u002Foption>\n            <option value=\"approved\">Confirmed<\u002Foption>\n            <option value=\"pending\">Pending<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasStaffRows }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ staffRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; gap:18px; padding:16px; background:#fff; border:1px solid #e7e2db; border-radius:12px; align-items:flex-start;\">\n                <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0;\">\n                  <label style=\"position:relative; width:60px; height:78px; border-radius:8px; overflow:hidden; background:#f4eef4; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#AC1BB9; font-family:'Archivo', sans-serif; font-weight:800; font-size:20px;\" style-hover=\"opacity:0.85;\" sc-camel-on-drag-over=\"{{ r.onPhotoDragOver }}\" sc-camel-on-drag-leave=\"{{ r.onPhotoDragLeave }}\" sc-camel-on-drop=\"{{ r.onPhotoDrop }}\">\n                    {{ r.initials }}{{ r.thumb }}\n                    <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ r.swapHeadshot }}\" style=\"display:none;\">\n                    <sc-if value=\"{{ r.photoDrag }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"position:absolute; inset:0; background:rgba(172,27,185,0.18); border:2px dashed #AC1BB9; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#AC1BB9; font-family:'Archivo', sans-serif; font-size:10px; font-weight:800; letter-spacing:0.06em;\">DROP<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Flabel>\n                  <span style=\"font-family:'Archivo', sans-serif; font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#AC1BB9;\">Drag or click<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:10px;\">\n                  <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\">\n                    <input type=\"text\" value=\"{{ r.name }}\" sc-camel-on-change=\"{{ r.editName }}\" style=\"font-family:'Archivo', sans-serif; font-weight:700; font-size:17px; color:#18151a; border:none; border-bottom:1px solid #efe9e0; background:transparent; padding:2px 0; width:210px;\" style-focus=\"border-bottom-color:#AC1BB9; outline:none;\">\n                    <sc-if value=\"{{ r.isPending }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"font-family:'Archivo', sans-serif; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#931AA0; background:#f6e4f7; padding:3px 9px; border-radius:999px;\">Pending<\u002Fspan>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ r.isApproved }}\" hint-placeholder-val=\"{{ true }}\">\n                      <span style=\"font-family:'Archivo', sans-serif; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#117F78; background:#e0efed; padding:3px 9px; border-radius:999px;\">Confirmed<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:14px; font-size:13px; color:#6f6a73; flex-wrap:wrap;\">\n                    <span>{{ r.city }}<\u002Fspan>\n                    <span style=\"display:flex; align-items:center; gap:6px;\">Age\n                      <input type=\"number\" min=\"16\" max=\"99\" value=\"{{ r.age }}\" sc-camel-on-change=\"{{ r.editAge }}\" style=\"font-family:'Hanken Grotesk', sans-serif; font-size:13px; width:56px; border:1px solid #e2dccf; border-radius:6px; padding:3px 6px; background:#fff; color:#18151a;\" style-focus=\"border-color:#AC1BB9; outline:none;\">\n                    <\u002Fspan>\n                    <span>{{ r.ago }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ r.hasLangs }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n                      <sc-for list=\"{{ r.langs }}\" as=\"l\" hint-placeholder-count=\"2\">\n                        <span style=\"font-family:'Archivo', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#117F78; background:#e0efed; padding:3px 9px; border-radius:999px;\">{{ l }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:2px;\">\n                    <span style=\"font-size:11px; font-family:monospace; color:#117F78; background:#e0efed; padding:4px 8px; border-radius:6px;\">PDF<\u002Fspan>\n                    <span style=\"font-size:13px; color:#3a363f; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ r.resumeLabel }}<\u002Fspan>\n                    <sc-if value=\"{{ r.resumeData }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ r.openResume }}\" style=\"font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#AC1BB9; background:transparent; border:none; padding:0; cursor:pointer;\" style-hover=\"text-decoration:underline;\">View ↗<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ r.resumeData }}\" hint-placeholder-val=\"{{ false }}\">\n                      <a href=\"{{ r.resumeData }}\" download=\"{{ r.resumeName }}\" style=\"font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#6f6a73; text-decoration:none;\">Download<\u002Fa>\n                    <\u002Fsc-if>\n                    <label style=\"position:relative; display:inline-flex; align-items:center; font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#AC1BB9; cursor:pointer; border:1px dashed #e3b8e7; border-radius:8px; padding:6px 10px;\" style-hover=\"background:#f9e8fa;\" sc-camel-on-drag-over=\"{{ r.onResumeDragOver }}\" sc-camel-on-drag-leave=\"{{ r.onResumeDragLeave }}\" sc-camel-on-drop=\"{{ r.onResumeDrop }}\">\n                      Drop or swap\n                      <input type=\"file\" accept=\".pdf,.doc,.docx\" sc-camel-on-change=\"{{ r.swapResume }}\" style=\"display:none;\">\n                      <sc-if value=\"{{ r.resumeDrag }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"position:absolute; inset:0; background:rgba(172,27,185,0.16); border:2px dashed #AC1BB9; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#AC1BB9; font-family:'Archivo', sans-serif; font-size:10px; font-weight:800; letter-spacing:0.06em;\">DROP<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex; flex-direction:column; gap:8px; flex-shrink:0;\">\n                  <sc-if value=\"{{ r.isPending }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ r.approve }}\" style=\"font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#fff; background:#AC1BB9; border:none; border-radius:8px; padding:8px 14px; cursor:pointer;\" style-hover=\"background:#931AA0;\">Approve<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ r.isApproved }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button sc-camel-on-click=\"{{ r.unpublish }}\" style=\"font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#6f6a73; background:transparent; border:1px solid #d7d2cb; border-radius:8px; padding:8px 14px; cursor:pointer;\" style-hover=\"background:#f1ece4;\">Unpublish<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <button sc-camel-on-click=\"{{ r.del }}\" style=\"font-family:'Archivo', sans-serif; font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#931AA0; background:transparent; border:none; padding:8px 14px; cursor:pointer;\" style-hover=\"text-decoration:underline;\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noStaffRows }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px dashed #d7d2cb; border-radius:12px; padding:48px 24px; text-align:center; color:#9a948a;\">\n            <div style=\"font-family:'Archivo', sans-serif; font-weight:800; text-transform:uppercase; font-size:18px; color:#6f6a73; margin-bottom:6px;\">No submissions match this filter<\u002Fdiv>\n            <div style=\"font-size:14px;\">Try a different city or status.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <sc-if value=\"{{ showFooter }}\" hint-placeholder-val=\"{{ false }}\">\n    <footer style=\"border-top:1px solid #e7e2db; max-width:1060px; width:100%; margin:0 auto; padding:22px 28px; display:flex; justify-content:space-between; align-items:center;\">\n      <span style=\"font-size:12px; color:#9a948a;\">Ultimate Performer 2026<\u002Fspan>\n      <span style=\"font-size:12px; color:#9a948a;\">{{ cityName }}<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;requireApproval&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;},\n  &quot;showAgePublicly&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;},\n  &quot;staffPasscode&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;summit2026&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Staff&quot;},\n  &quot;cityCodeAustralia&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;sydney26&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Event passwords&quot;},\n  &quot;cityCodeDubai&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;dubai26&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Event passwords&quot;}\n}\">\nconst KEY = 'actingSummit.v2';\nconst CITIES_KEY = 'actingSummit.cities.v1';\n\nclass Component extends DCLogic {\n  state = {\n    submissions: null,\n    cities: null,\n    mode: 'staff', clientCity: null,\n    view: 'launcher', selectedCity: null,\n    newCityName: '', newCityWhen: '', newCityCode: '', cityFormError: null,\n    editCityKey: null, editCityName: '', editCityWhen: '', editCityCode: '', editCityError: null,\n    formName: '', formAge: '', formHeadshot: null, formHeadshotName: null,\n    formResume: null, formResumeName: null,\n    formLang1: '', formLang2: '', formLang3: '',\n    error: null,\n    gateInput: '', gateError: null, unlockedCities: {},\n    staffUnlocked: false, staffPass: '', staffError: null,\n    staffCityFilter: 'all', staffStatusFilter: 'all',\n    dragKey: null, copiedCity: null,\n    lightbox: null\n  };\n\n  onKeyDown = (e) => { if (e.key === 'Escape' && this.state.lightbox) this.closeLightbox(); };\n  openLightbox = (sub) => this.setState({ lightbox: sub });\n  closeLightbox = () => this.setState({ lightbox: null });\n\n  componentDidMount() {\n    const cities = this.loadCities();\n    let mode = 'staff', clientCity = null, view = 'launcher';\n    try {\n      const raw = new URLSearchParams(window.location.search).get('city');\n      if (raw) {\n        const match = cities.find(c => c.key.toLowerCase() === String(raw).toLowerCase());\n        if (match) { mode = 'client'; clientCity = match.key; view = 'clientHome'; }\n      }\n    } catch (e) {}\n    this.setState({ cities, mode, clientCity, selectedCity: clientCity, view });\n    this.hydrate();\n    try { window.addEventListener('keydown', this.onKeyDown); } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    try { window.removeEventListener('keydown', this.onKeyDown); } catch (e) {}\n  }\n\n  hydrate() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const stored = JSON.parse(raw);\n        // backfill languages on demo/seed rows created before the field existed\n        const seedLangs = {};\n        this.seed().forEach(s => { seedLangs[s.id] = s.languages; });\n        let changed = false;\n        const merged = stored.map(s => {\n          if (!s.languages && seedLangs[s.id]) { changed = true; return { ...s, languages: seedLangs[s.id] }; }\n          return s;\n        });\n        this.setState({ submissions: merged });\n        if (changed) this.save(merged);\n        return;\n      }\n    } catch (e) {}\n    const seed = this.seed();\n    this.setState({ submissions: seed });\n    this.save(seed);\n  }\n\n  save(subs) {\n    try { localStorage.setItem(KEY, JSON.stringify(subs)); }\n    catch (e) { console.warn('Storage limit reached; submissions kept in memory only.', e); }\n  }\n\n  seed() {\n    const day = 86400000, now = Date.now();\n    const mk = (name, age, city, d, langs, status) => ({\n      id: 'seed-' + name.replace(/\\s/g, ''), name, age, city,\n      headshot: null, resumeName: null, resumeData: null, languages: langs,\n      status: status || 'approved', createdAt: now - d * day\n    });\n    return [\n      mk('Maya Okonkwo', 27, 'Australia', 12, ['English', 'Igbo', 'French']),\n      mk('Daniel Reyes', 34, 'Australia', 9, ['English', 'Spanish']),\n      mk('Priya Anand', 22, 'Australia', 5, ['English', 'Hindi', 'Tamil']),\n      mk('Sofia Marsh', 25, 'Australia', 1, ['English', 'Italian'], 'pending'),\n      mk('Jordan Bellini', 41, 'Dubai', 11, ['English', 'Italian']),\n      mk('Aisha Carter', 29, 'Dubai', 7, ['English', 'Arabic', 'French']),\n      mk('Theo Lindqvist', 38, 'Dubai', 3, ['English', 'Swedish', 'German']),\n      mk('Omar Haddad', 31, 'Dubai', 1, ['Arabic', 'English'], 'pending')\n    ];\n  }\n\n  readFile(file, cb) { const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(file); }\n\n  viewResume = (dataUrl, name) => {\n    try {\n      if (!dataUrl) return;\n      const parts = String(dataUrl).split(',');\n      const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/pdf';\n      const bin = atob(parts[1]);\n      const arr = new Uint8Array(bin.length);\n      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);\n      const url = URL.createObjectURL(new Blob([arr], { type: mime }));\n      window.open(url, '_blank', 'noopener');\n      setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);\n    } catch (e) { console.warn('Could not open résumé', e); }\n  };\n\n  cityCode(key) { const c = this.cityInfo(key); return c && c.code; }\n\n  defaultCities() {\n    return [\n      { key: 'Australia', name: 'Australia', when: 'Sydney · 14–16 March 2026', code: this.props.cityCodeAustralia ?? 'sydney26' },\n      { key: 'Dub
